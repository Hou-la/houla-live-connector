name: Build connector binaries

# Builds ONE self-contained binary per OS that a non-technical streamer can just
# download + run (no npm, no terminal): Windows (.exe double-click), macOS (Intel
# + Apple Silicon), Linux. Each zip ships the binary + a starter houla.config.json
# + the Minecraft bundle.json + QUICKSTART. Runs on a version tag → attaches every
# zip to the GitHub Release. Also available on-demand via "Run workflow".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Required so softprops/action-gh-release can create the Release + upload assets
# (default GITHUB_TOKEN is read-only in this org → 403 otherwise).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2

      - run: npm ci
      - run: npm run build # tsc → dist/

      # Bun cross-compiles the CJS runner + its deps into ONE self-contained
      # binary per target, from this single Linux runner.
      - name: Build all platforms + package each zip
        run: |
          set -euo pipefail
          # name → "bun-target:binary-name"
          declare -A T=(
            [windows-x64]="bun-windows-x64:houla-connector.exe"
            [linux-x64]="bun-linux-x64:houla-connector"
            [macos-intel]="bun-darwin-x64:houla-connector"
            [macos-apple-silicon]="bun-darwin-arm64:houla-connector"
          )
          mkdir -p out
          for name in "${!T[@]}"; do
            spec="${T[$name]}"; target="${spec%%:*}"; binname="${spec##*:}"
            dir="pkg/$name"; mkdir -p "$dir"
            bun build bin/houla-connector.js --compile --target="$target" --outfile "$dir/$binname"
            cp houla.config.example.json "$dir/houla.config.json"
            cp examples/minecraft.bundle.json "$dir/bundle.json"
            cp QUICKSTART.md "$dir/QUICKSTART.md"
            (cd "$dir" && zip -r "../../out/houla-connector-$name.zip" .)
          done
          ls -la out

      - name: Attach every binary to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true

      - name: Upload as workflow artifacts (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: houla-connector-binaries
          path: out/*.zip
